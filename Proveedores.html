<div id="vistaTablaProv" class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="fw-bold m-0" style="color: var(--azul);">🏢 Catálogo de Proveedores</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm fw-bold text-white" style="background:var(--azul);" onclick="window.cargarDatosProv()">↻ Actualizar</button>
      <button class="btn btn-sm fw-bold" style="background-color:#1D6F42; color:white;" onclick="window.exportarExcelProveedores()">📥 Descargar Excel</button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-3">
          <input type="text" id="filtroNombreProv" class="form-control" placeholder="🔍 Proveedor..." onkeyup="window.filtrarTablaProv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroRSProv" class="form-control" placeholder="🔍 Razón Social / RFC..." onkeyup="window.filtrarTablaProv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="text" id="filtroContactoProv" class="form-control" placeholder="🔍 Contacto..." onkeyup="window.filtrarTablaProv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="text" id="filtroQuienProv" class="form-control" placeholder="🔍 Quien Registra..." onkeyup="window.filtrarTablaProv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <button class="btn w-100 fw-bold text-white" style="background-color: var(--dorado); color: var(--azul) !important;" onclick="window.toggleVistaProv('form')">+ Nuevo Proveedor</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0" id="tablaProv">
          <thead class="table-dark">
            <tr>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 0)">ID ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 1)">Proveedor ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 2)">Razón Social ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 3)">RFC ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 4)">Contacto ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 5)">Teléfono ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaProv', 6)">Quien Registró ↕</th>
              <th class="text-center" style="white-space:nowrap;">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaProv">
            <tr><td colspan="8" class="text-center py-4 text-muted">Cargando proveedores...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="vistaFormProv" class="container-fluid p-0" style="display: none;">
  <div class="mb-3">
    <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.toggleVistaProv('tabla')">← Regresar a la lista</button>
    <span id="ind_sin_guardar_vistaFormProv" style="color:#dc3545;font-weight:bold;font-size:0.82rem;display:none;">🔴 Cambios sin guardar</span>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3" style="border-bottom: 3px solid var(--dorado);">
      <h4 class="m-0 fw-bold text-center" style="color: var(--azul);">Registro de Proveedor</h4>
    </div>
    <div class="card-body bg-white p-4">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Proveedor (Nombre Comercial) *</label>
          <input type="text" id="p_proveedor" class="form-control" style="text-transform:uppercase;">
        </div>
        <div class="col-md-6 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Razón Social *</label>
          <input type="text" id="p_razonsocial" class="form-control" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">RFC</label>
          <input type="text" id="p_rfc" class="form-control" style="text-transform:uppercase;">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Estado</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_p_estado" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('p_estado','ESTADO_REP')">
              <span id="lbl_p_estado" class="text-truncate">— Selecciona Estado —</span><span>▼</span>
            </button>
            <input type="hidden" id="p_estado" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_p_estado')"></li>
              <div id="lista_p_estado"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Dirección</label>
          <input type="text" id="p_direccion" class="form-control" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Nombre del Contacto</label>
          <input type="text" id="p_contacto" class="form-control" style="text-transform:uppercase;">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Número de Contacto</label>
          <input type="text" id="p_numero" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Correo Electrónico</label>
          <input type="email" id="p_correo" class="form-control" style="text-transform:lowercase;">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Segmentación de Servicio</label>
          <input type="text" id="p_segmentacion" class="form-control" style="text-transform:uppercase;">
        </div>
        <div class="col-md-6 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Servicio</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_p_servicio" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('p_servicio','SERVICIO')">
              <span id="lbl_p_servicio" class="text-truncate">— Selecciona Servicio —</span><span>▼</span>
            </button>
            <input type="hidden" id="p_servicio" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_p_servicio')"></li>
              <div id="lista_p_servicio"></div>
            </ul>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Días de Crédito</label>
          <input type="number" id="p_diascredito" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Total de Crédito</label>
          <input type="number" id="p_totalcredito" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Razones Sociales Compatibles</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_p_razonessociales" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('p_razonessociales','RAZONES_SOCIALES_EMPRESA')">
              <span id="lbl_p_razonessociales" class="text-truncate">— Selecciona una o varias —</span><span>▼</span>
            </button>
            <input type="hidden" id="p_razonessociales" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_p_razonessociales')"></li>
              <div id="lista_p_razonessociales" data-multi="true"></div>
            </ul>
          </div>
          <small class="text-muted" style="font-size:0.72rem;">Haz clic en cada opción para seleccionar varias</small>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Régimen Fiscal</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_p_regimenfiscal" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('p_regimenfiscal','REGIMEN_FISCAL')">
              <span id="lbl_p_regimenfiscal" class="text-truncate">— Selecciona Régimen —</span><span>▼</span>
            </button>
            <input type="hidden" id="p_regimenfiscal" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_p_regimenfiscal')"></li>
              <div id="lista_p_regimenfiscal"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">¿Intercambio?</label>
          <select id="p_intercambio2" class="form-select">
            <option value="NO">NO</option>
            <option value="SI">SÍ</option>
          </select>
        </div>
      </div>

      <div class="mt-4 text-center">
        <button type="button" class="btn text-white fw-bold py-3 shadow-sm w-100" id="btnGP"
                style="background-color: var(--azul); font-size: 1.1rem; border-radius: 6px;"
                onclick="window.guardarProveedor()">Guardar Proveedor</button>
      </div>
      <div id="msjProv" class="mt-3 text-center fw-bold"></div>
    </div>
  </div>
</div>
