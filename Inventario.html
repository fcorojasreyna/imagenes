<div id="vistaTablaInventario" class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold m-0" style="color: var(--azul);">📦 Control de Inventario y Almacén</h4>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-2">
          <input type="text" id="filtroTicketInv" class="form-control" placeholder="🔍 Ticket..." onkeyup="window.filtrarTablaInv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroProductoInv" class="form-control" placeholder="🔍 Producto / Marca..." onkeyup="window.filtrarTablaInv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroQuienInv" class="form-control" placeholder="🔍 Quien Registra..." onkeyup="window.filtrarTablaInv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="date" id="filtroFechaInv" class="form-control" onchange="window.filtrarTablaInv()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <button class="btn w-100 fw-bold text-white" style="background-color: var(--dorado); color: var(--azul) !important;" onclick="window.toggleVistaInv('form')">+ Ingresar Refacciones</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 0)">Ticket ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 1)">Folio CPP ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 2)">Producto / Marca ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 3)">Vehículo ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 4)">Cantidad ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 5)">Costo Unit. ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 6)">Costo Total ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 7)">Estatus ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 8)">Quien Registra ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaInv', 9)">Fecha ↕</th>
              <th class="text-center" style="white-space:nowrap;">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaInv">
            <tr><td colspan="11" class="text-center py-4 text-muted">Cargando base de datos del almacén...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="vistaFormInventario" class="container-fluid p-0" style="display: none;">
  <div class="mb-3">
    <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.toggleVistaInv('tabla')">← Regresar a la tabla</button>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3" style="border-bottom: 3px solid var(--dorado);">
      <h4 class="m-0 fw-bold text-center" style="color: var(--azul);">Registro de Refacciones en Almacén</h4>
    </div>
    <div class="card-body bg-white p-4">

      <div class="row mb-4">
        <div class="col-md-6 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Ticket *</label>
          <input type="text" id="ticket" class="form-control" placeholder="Ej. 12345">
        </div>
        <div class="col-md-6 mb-3">
          <label class="fw-bold text-muted" style="font-size: 0.85rem;">Observaciones del Ticket</label>
          <input type="text" id="obsTicket" class="form-control" placeholder="EJ. COMPRA URGENTE">
        </div>
        <input type="hidden" id="folioCpp" value="">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 mt-2" style="border-bottom: 2px solid var(--dorado); padding-bottom: 10px;">
        <h6 class="fw-bold m-0" style="color: var(--azul);">REFACCIONES ADQUIRIDAS</h6>
        <button class="btn btn-sm text-white fw-bold shadow-sm" style="background-color: var(--azul);" onclick="window.agregarArticuloInventario()">
          + Agregar Artículo
        </button>
      </div>

      <div id="contenedor-articulos-inventario"></div>

      <div class="mt-5 text-center">
        <button id="btnGI" class="btn text-white fw-bold py-3 shadow-sm w-100" style="background-color: var(--azul); font-size: 1.1rem; border-radius: 6px;" onclick="window.procesarInventario()">
          Registrar Refacción en Almacén
        </button>
      </div>
    </div>
  </div>
</div>
