<div id="vistaTablaTaller" class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold m-0" style="color: var(--azul);">🔧 Bitácora de Taller</h4>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-2">
          <input type="text" id="filtroTicketTaller" class="form-control" placeholder="🔍 Ticket..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroNucoTaller" class="form-control" placeholder="🔍 NUCO..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroQuienTaller" class="form-control" placeholder="🔍 Quien Registra..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="date" id="filtroFechaTaller" class="form-control" onchange="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <button class="btn w-100 fw-bold text-white" style="background-color: var(--dorado); color: var(--azul) !important;" onclick="window.toggleVistaTaller('form')">+ Ingresar Vehículo</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 0)">Ticket ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 1)">NUCO ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 2)">Servicio ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 3)">Descripción ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 4)">Proveedor ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 5)">Costo Total ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 6)">Estatus ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 7)">Quien Registra ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 8)">Fecha ↕</th>
              <th class="text-center" style="white-space:nowrap;">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaTaller">
            <tr><td colspan="10" class="text-center py-4 text-muted">Cargando bitácora de taller...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="vistaFormTaller" class="container-fluid p-0" style="display: none;">
  <div class="mb-3">
    <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.toggleVistaTaller('tabla')">← Regresar a la bitácora</button>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3" style="border-bottom: 3px solid var(--dorado);">
      <h5 class="m-0 fw-bold" style="color: var(--azul);">Registro de Mantenimientos y Taller</h5>
    </div>
    <div class="card-body p-4 bg-white">

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">Información Vehicular</h6>
      <div class="row mb-3">
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Ticket *</label>
          <input type="text" id="ticket" class="form-control border-dark" placeholder="Ej. 1234">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">NUCO *</label>
          <input type="text" id="nuco" class="form-control border-primary" placeholder="Autocompleta..."
                 onblur="window.autocompletarNuco(this.value, 'taller')">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Placas</label>
          <input type="text" id="placas" class="form-control bg-light" readonly>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Serie</label>
          <input type="text" id="serie" class="form-control bg-light" readonly>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Línea</label>
          <input type="text" id="linea" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Modelo</label>
          <input type="text" id="modelo" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Sede</label>
          <input type="text" id="sede" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Oficina</label>
          <input type="text" id="oficina" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Departamento</label>
          <input type="text" id="departamento" class="form-control bg-light" readonly tabindex="-1">
        </div>
      </div>

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2 mt-2">Especificaciones del Servicio</h6>
      <div class="row mb-3">
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Odómetro Act.</label>
          <input type="text" id="odometro" class="form-control" placeholder="KM...">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Fecha Servicio</label>
          <input type="date" id="fechaServicio" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Tipo de Servicio *</label>
          <select id="tipoServicio" class="form-select border-dark">
            <option value="MANTENIMIENTO">MANTENIMIENTO</option>
            <option value="REPARACION">REPARACIÓN</option>
            <option value="DIAGNOSTICO">DIAGNÓSTICO</option>
            <option value="HOJALATERIA Y PINTURA">HOJALATERÍA Y PINTURA</option>
            <option value="REVISION SV">REVISIÓN SV</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Familia *</label>
          <select id="familia" class="form-select border-dark">
            <option value="AFINACION MAYOR">AFINACIÓN MAYOR</option>
            <option value="AFINACION MENOR">AFINACIÓN MENOR</option>
            <option value="SISTEMA DE FRENOS">SISTEMA DE FRENOS</option>
            <option value="SISTEMA DE SUSPENSION">SISTEMA DE SUSPENSIÓN</option>
            <option value="SISTEMA DE DIRECCION">SISTEMA DE DIRECCIÓN</option>
            <option value="SISTEMA DE MOTOR">SISTEMA DE MOTOR</option>
            <option value="SISTEMA DE ENFRIAMIENTO">SISTEMA DE ENFRIAMIENTO</option>
            <option value="SISTEMA DE ILUMINACION">SISTEMA DE ILUMINACIÓN</option>
            <option value="CLUTCH">CLUTCH</option>
            <option value="BATERIA">BATERÍA</option>
            <option value="LLANTAS">LLANTAS</option>
            <option value="SISTEMA ELECTRICO">SISTEMA ELÉCTRICO</option>
            <option value="HOJALATERIA Y PINTURA">HOJALATERÍA Y PINTURA</option>
            <option value="REVISION SV">REVISIÓN SV</option>
          </select>
        </div>
      </div>

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2 mt-2">Detalles y Costos</h6>
      <div class="row mb-3">
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Realizado Por *</label>
          <select id="proveedor" class="form-select border-primary" onchange="window.toggleCamposTaller()">
            <option value="INTERNO">INTERNO</option>
            <option value="EXTERNO">EXTERNO</option>
            <option value="AMBOS">AMBOS</option>
          </select>
        </div>
        <div class="col-md-2 mb-3" id="divInterno">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">M. de Obra Interna</label>
          <div class="input-group">
            <span class="input-group-text bg-white">$</span>
            <input type="text" id="servInterno" class="form-control border-dark" oninput="window.calcularTotalTaller()" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-2 mb-3" id="divExterno" style="display:none;">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">M. de Obra Externa</label>
          <div class="input-group">
            <span class="input-group-text bg-white">$</span>
            <input type="text" id="servExterno" class="form-control border-success" oninput="window.calcularTotalTaller()" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Costo Total (MO + Refacciones)</label>
          <div class="input-group">
            <span class="input-group-text" style="background-color: var(--azul); color: white;">$</span>
            <input type="text" id="costoTotalTaller" class="form-control bg-light fw-bold" readonly placeholder="0.00">
          </div>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Cant. Refacciones</label>
          <input type="number" id="numeroPartes" class="form-control text-center fw-bold" value="0" min="0">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Descripción de Actividades / Observaciones *</label>
          <textarea id="descripcion" class="form-control" rows="2" placeholder="Describe los trabajos realizados..."></textarea>
        </div>
        <input type="hidden" id="alertaTicket" value="TICKET NUEVO">
      </div>

      <div class="row align-items-center mb-3">
        <div class="col-md-5">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Estatus de la Unidad *</label>
          <select id="estatusUnidad" class="form-select border-primary fw-bold">
            <option value="PROGRAMADA" selected>📅 PROGRAMADA</option>
            <option value="INGRESADA">⏳ INGRESADA</option>
            <option value="FINALIZADA">✅ FINALIZADA</option>
          </select>
        </div>
        <input type="hidden" id="evidencia" value="SIN EVIDENCIA">
        <input type="hidden" id="folioCpp" value="">
      </div>

      <div class="mt-4 text-end border-top pt-4">
        <button id="btnGT" class="btn text-white fw-bold px-5 py-2 shadow-sm" style="background-color: var(--azul); font-size: 1.1rem; border-radius: 6px;" onclick="window.procesarTaller()">
          Guardar Registro en Bitácora
        </button>
      </div>
    </div>
  </div>
</div>
