<div id="vistaTablaTaller" class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="fw-bold m-0" style="color: var(--azul);">🔧 Bitácora de Taller</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm fw-bold text-white" style="background:var(--azul);" onclick="window.cargarDatosTaller()">↻ Actualizar</button>
      <button class="btn btn-sm fw-bold" style="background-color:#1D6F42; color:white;" onclick="window.exportarExcelTaller()">📥 Descargar Excel</button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-2">
          <input type="text" id="filtroTicketTaller" class="form-control" placeholder="🔍 Ticket..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroNucoTaller" class="form-control" placeholder="🔍 NUCO..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <input type="text" id="filtroQuienTaller" class="form-control" placeholder="🔍 Quien Registra..." onkeyup="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="date" id="filtroFechaTaller" class="form-control" onchange="window.filtrarTablaTaller()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <button class="btn w-100 fw-bold text-white" style="background-color: var(--dorado); color: var(--azul) !important;" onclick="window.toggleVistaTaller('form')">+ Ingresar Vehículo</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 0)" data-sort-col="0">Ticket <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 1)" data-sort-col="1">NUCO <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 2)" data-sort-col="2">Servicio <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 3)" data-sort-col="3">Descripción <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 4)" data-sort-col="4">Proveedor <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 5)" data-sort-col="5">Costo Total <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 6)" data-sort-col="6">Estatus <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 7)" data-sort-col="7">Quien Registra <span class="sort-arrow">↕</span></th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaTaller', 8)" data-sort-col="8">Fecha <span class="sort-arrow">↕</span></th>
              <th class="text-center" style="white-space:nowrap;">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaTaller">
            <tr><td colspan="10" class="text-center py-4 text-muted">Cargando bitácora de taller...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="vistaFormTaller" class="container-fluid p-0" style="display: none;">
  <div class="mb-3">
    <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.toggleVistaTaller('tabla')">← Regresar a la bitácora</button>
    <span id="ind_sin_guardar_vistaFormTaller" style="color:#dc3545;font-weight:bold;font-size:0.82rem;display:none;">🔴 Cambios sin guardar</span>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3" style="border-bottom: 3px solid var(--dorado);">
      <h5 class="m-0 fw-bold" style="color: var(--azul);">Registro de Mantenimientos y Taller</h5>
    </div>
    <div class="card-body p-4 bg-white">

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">Información Vehicular</h6>
      <div class="row mb-3">
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Ticket *</label>
          <input type="text" id="ticket" class="form-control border-dark" placeholder="Ej. 1234">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">NUCO *</label>
          <input type="text" id="nuco" class="form-control" placeholder="Autocompleta..."
                 onblur="window.autocompletarNuco(this.value, 'taller', this)"
                 onkeydown="if(event.key==='Enter'){event.preventDefault(); window.autocompletarNuco(this.value, 'taller', this);}">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Placas</label>
          <input type="text" id="placas" class="form-control bg-light" readonly>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Serie</label>
          <input type="text" id="serie" class="form-control bg-light" readonly>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Línea</label>
          <input type="text" id="linea" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Modelo</label>
          <input type="text" id="modelo" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Sede</label>
          <input type="text" id="sede" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Oficina</label>
          <input type="text" id="oficina" class="form-control bg-light" readonly tabindex="-1">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Departamento</label>
          <input type="text" id="departamento" class="form-control bg-light" readonly tabindex="-1">
        </div>
      </div>

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2 mt-2">Especificaciones del Servicio</h6>
      <div class="row mb-3">
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Odómetro Act.</label>
          <input type="text" id="odometro" class="form-control" placeholder="KM...">
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Fecha Servicio</label>
          <input type="date" id="fechaServicio" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Tipo de Servicio *</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_tipoServicio" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d; border: var(--bs-border-width) solid #212529 !important;" onclick="window.abrirDropdownCat('tipoServicio','TIPO_SERVICIO')">
              <span id="lbl_tipoServicio" class="text-truncate">— Tipo de Servicio —</span><span>▼</span>
            </button>
            <input type="hidden" id="tipoServicio" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_tipoServicio')"></li>
              <div id="lista_tipoServicio"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Familia *</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_familia" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d; border: var(--bs-border-width) solid #212529 !important;" onclick="window.abrirDropdownCat('familia','FAMILIA')">
              <span id="lbl_familia" class="text-truncate">— Familia —</span><span>▼</span>
            </button>
            <input type="hidden" id="familia" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_familia')"></li>
              <div id="lista_familia"></div>
            </ul>
          </div>
        </div>
      </div>

      <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2 mt-2">Detalles y Costos</h6>
      <div class="row mb-3">
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Realizado Por *</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_proveedor" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d; border-color: var(--bs-primary) !important;" onclick="window.abrirDropdownCat('proveedor','REALIZADO_POR')">
              <span id="lbl_proveedor" class="text-truncate">— Realizado Por —</span><span>▼</span>
            </button>
            <input type="hidden" id="proveedor" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_proveedor')"></li>
              <div id="lista_proveedor"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-2 mb-3" id="divInterno">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">M. de Obra Interna</label>
          <div class="input-group">
            <span class="input-group-text bg-white">$</span>
            <input type="text" id="servInterno" class="form-control border-dark" oninput="window.calcularTotalTaller()" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-2 mb-3" id="divExterno" style="display:none;">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">M. de Obra Externa</label>
          <div class="input-group">
            <span class="input-group-text bg-white">$</span>
            <input type="text" id="servExterno" class="form-control border-success" oninput="window.calcularTotalTaller()" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Costo Total (MO + Refacciones)</label>
          <div class="input-group">
            <span class="input-group-text" style="background-color: var(--azul); color: white;">$</span>
            <input type="text" id="costoTotalTaller" class="form-control bg-light fw-bold" readonly placeholder="0.00">
          </div>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Cant. Refacciones</label>
          <input type="number" id="numeroPartes" class="form-control text-center fw-bold" value="0" min="0">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Descripción de Actividades / Observaciones *</label>
          <textarea id="descripcion" class="form-control" rows="2" placeholder="Describe los trabajos realizados..."></textarea>
        </div>
        <input type="hidden" id="alertaTicket" value="TICKET NUEVO">
      </div>

      <div class="row align-items-center mb-3">
        <div class="col-md-5">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Estatus de la Unidad *</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_estatusUnidad" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d; border-color: var(--bs-primary) !important;" onclick="window.abrirDropdownCat('estatusUnidad','ESTATUS_TALLER')">
              <span id="lbl_estatusUnidad" class="text-truncate">— Estatus Unidad —</span><span>▼</span>
            </button>
            <input type="hidden" id="estatusUnidad" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_estatusUnidad')"></li>
              <div id="lista_estatusUnidad"></div>
            </ul>
          </div>
        </div>
        <input type="hidden" id="evidencia" value="SIN EVIDENCIA">
        <input type="hidden" id="folioCpp" value="">
      </div>

      <div class="mt-4 text-end border-top pt-4">
        <button id="btnGT" class="btn text-white fw-bold px-5 py-2 shadow-sm" style="background-color: var(--azul); font-size: 1.1rem; border-radius: 6px;" onclick="window.procesarTaller()">
          Guardar Registro en Bitácora
        </button>
      </div>
    </div>
  </div>
</div>
