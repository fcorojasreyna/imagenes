<div id="vistaTablaHerramientas" class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="fw-bold m-0" style="color: var(--azul);">🔩 Herramientas y Artículos</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm fw-bold text-white" style="background:var(--azul);" onclick="window.cargarDatosHerramientas()">↻ Actualizar</button>
      <button class="btn btn-sm fw-bold" style="background-color:#1D6F42; color:white;" onclick="window.exportarExcelHerramientas()">📥 Descargar Excel</button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-3">
          <input type="text" id="filtroNombreHerr" class="form-control" placeholder="🔍 Nombre..." onkeyup="window.filtrarTablaHerramientas()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="text" id="filtroTipoHerr" class="form-control" placeholder="🔍 Tipo..." onkeyup="window.filtrarTablaHerramientas()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="text" id="filtroLugarHerr" class="form-control" placeholder="🔍 Lugar..." onkeyup="window.filtrarTablaHerramientas()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-2">
          <input type="text" id="filtroEstatusHerr" class="form-control" placeholder="🔍 Estatus..." onkeyup="window.filtrarTablaHerramientas()" style="border: 2px solid #B4A169;">
        </div>
        <div class="col-md-3">
          <button class="btn w-100 fw-bold text-white" style="background-color: var(--dorado); color: var(--azul) !important;" onclick="window.toggleVistaHerramientas('form')">+ Nueva Herramienta</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 0)">ID ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 1)">Tipo ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 2)">Tipo Unidad ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 3)">Nombre ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 4)">Marca ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 5)">Estado ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 6)">Lugar ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 7)">Estatus ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 8)">Existencia ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 9)">Fecha ↕</th>
              <th style="cursor:pointer; white-space:nowrap;" onclick="window.ordenarTabla('cuerpoTablaHerramientas', 10)">Quien Registra ↕</th>
              <th class="text-center" style="white-space:nowrap;">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaHerramientas">
            <tr><td colspan="12" class="text-center py-4 text-muted">Cargando herramientas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="vistaFormHerramientas" class="container-fluid p-0" style="display: none;">
  <div class="mb-3">
    <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.toggleVistaHerramientas('tabla')">← Regresar al listado</button>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3" style="border-bottom: 3px solid var(--dorado);">
      <h5 class="m-0 fw-bold text-center" style="color: var(--azul);">Registro de Herramienta / Artículo</h5>
    </div>
    <div class="card-body bg-white p-4">

      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Tipo *</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_herr_tipo" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('herr_tipo','TIPO_HERRAMIENTA')">
              <span id="lbl_herr_tipo" class="text-truncate">— Tipo —</span><span>▼</span>
            </button>
            <input type="hidden" id="herr_tipo" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_herr_tipo')"></li>
              <div id="lista_herr_tipo"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Tipo de Unidad</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_herr_tipounidad" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('herr_tipounidad','UM')">
              <span id="lbl_herr_tipounidad" class="text-truncate">— Tipo Unidad —</span><span>▼</span>
            </button>
            <input type="hidden" id="herr_tipounidad" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_herr_tipounidad')"></li>
              <div id="lista_herr_tipounidad"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Nombre del Artículo *</label>
          <input type="text" id="herr_nombre" class="form-control" placeholder="Ej. LLAVE DE IMPACTO" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Marca</label>
          <input type="text" id="herr_marca" class="form-control" placeholder="Ej. SNAP-ON" style="text-transform:uppercase;">
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Estado</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_herr_estado" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('herr_estado','ESTADO_HERRAMIENTA')">
              <span id="lbl_herr_estado" class="text-truncate">— Estado —</span><span>▼</span>
            </button>
            <input type="hidden" id="herr_estado" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_herr_estado')"></li>
              <div id="lista_herr_estado"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Lugar / Ubicación</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_herr_lugar" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('herr_lugar','UBICACION_HERRAMIENTA')">
              <span id="lbl_herr_lugar" class="text-truncate">— Ubicación —</span><span>▼</span>
            </button>
            <input type="hidden" id="herr_lugar" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_herr_lugar')"></li>
              <div id="lista_herr_lugar"></div>
            </ul>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Estatus</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" type="button" id="btn_herr_estatus" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="background:white; font-size:0.9rem; color:#6c757d;" onclick="window.abrirDropdownCat('herr_estatus','ESTATUS_HERRAMIENTA')">
              <span id="lbl_herr_estatus" class="text-truncate">— Estatus —</span><span>▼</span>
            </button>
            <input type="hidden" id="herr_estatus" value="">
            <ul class="dropdown-menu w-100 p-2 shadow" style="max-height:260px; overflow-y:auto;">
              <li class="mb-1"><input type="text" class="form-control form-control-sm" placeholder="🔍 Buscar..." onclick="event.stopPropagation()" oninput="window.filtrarDropdownCat(this,'lista_herr_estatus')"></li>
              <div id="lista_herr_estatus"></div>
            </ul>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Existencia</label>
          <input type="number" id="herr_existencia" class="form-control" value="1" min="1">
        </div>
        <div class="col-md-3 mb-3">
          <label class="fw-bold" style="color: var(--azul); font-size: 0.85rem;">Fecha</label>
          <input type="date" id="herr_fecha" class="form-control">
        </div>
        <input type="hidden" id="herr_quien" value="">
      </div>

      <div class="mt-4 text-center">
        <button id="btnGHerr" class="btn text-white fw-bold py-3 shadow-sm w-100" style="background-color: var(--azul); font-size: 1.1rem; border-radius: 6px;" onclick="window.guardarHerramienta()">
          Guardar Herramienta / Artículo
        </button>
      </div>
    </div>
  </div>
</div>
